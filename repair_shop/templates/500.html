{% extends "base.html" %}
{% block title %}Ошибка сервера (500) — МастерСервис{% endblock %}

{% block content %}
<div class="text-center py-5">
    <h1 class="display-1 fw-bold text-danger">500</h1>
    <h3 class="mb-3">Внутренняя ошибка сервера</h3>
    <p class="text-muted mb-4">
        Произошла непредвиденная ошибка при обработке запроса. Транзакция базы данных была безопасно отменена.
    </p>
    <a href="{{ url_for('dashboard') if current_user.is_authenticated else url_for('login') }}" class="btn btn-primary">
        <i class="bi bi-house-door me-1"></i>На главную
    </a>
</div>
{% endblock %}
